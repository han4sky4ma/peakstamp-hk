<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>

    <link rel="manifest" href="manifest.json">
    <title>山印</title>
    <style>
        :root { 
            --primary: #2E5A44; 
            --secondary: #8B5A2B; 
            --bg: #F4F4F0; 
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 15px; 
            color: #333; 
        }
        .header { 
            background: var(--primary); 
            color: white; 
            padding: 15px; 
            border-radius: 12px; 
            text-align: center; 
            margin-bottom: 15px; 
        }
        .radar-card { 
            background: #e3ece4; 
            border: 2px dashed var(--primary); 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            text-align: center; 
        }
        .radar-canvas-container { 
            position: relative; 
            width: 220px; 
            height: 220px; 
            margin: 15px auto; 
            background: #1a2f24; 
            border-radius: 50%; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 4px 10px rgba(0,0,0,0.15); 
            border: 3px solid var(--primary); 
        }
        #radar-canvas { 
            border-radius: 50%; 
            display: block; 
        }
        .radar-item { 
            background: white; 
            padding: 10px; 
            border-radius: 8px; 
            margin-top: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 1px 4px rgba(0,0,0,0.05); 
            text-align: left; 
        }
        .radar-item strong { color: var(--primary); }
        .distance-tag { 
            background: var(--secondary); 
            color: white; 
            padding: 3px 8px; 
            border-radius: 12px; 
            font-size: 11px; 
            font-weight: bold; 
        }
        .btn-stamp-now { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 12px; 
        }
        .progress-card { 
            background: white; 
            padding: 15px; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
            margin-bottom: 15px; 
            text-align: center; 
        }
        .progress-bar { 
            background: #ddd; 
            height: 12px; 
            border-radius: 6px; 
            overflow: hidden; 
            margin-top: 8px; 
        }
        .progress-fill { 
            background: var(--primary); 
            height: 100%; 
            width: 0%; 
            transition: width 0.5s; 
        }
        .filter-section { 
            background: white; 
            padding: 12px; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
            margin-bottom: 15px; 
        }
        .filter-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .filter-row:last-child { margin-bottom: 0; }
        .select-filter { 
            flex: 1; 
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid #ccc; 
            background: white; 
            font-size: 13px; 
            font-weight: bold; 
            color: #444; 
            min-height: 40px; 
        }
        .select-filter:focus { border-color: var(--primary); outline: none; }
        .grid-count-tag { 
            font-size: 12px; 
            color: #666; 
            margin-bottom: 8px; 
            text-align: right; 
            font-weight: bold; 
        }
        .backup-card { 
            background: #fdfdfd; 
            border: 1px solid #e2e2e2; 
            padding: 12px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 8px;

        .btn-backup { 
            background: #34495e;

            border-radius: 8px;

            flex: 1;

        .btn-restore { 
            background: #7f8c8d; 
            color: white; 
            border: none; 
            padding: 10px; 
            border-radius: 8px; 
            font-weight: bold; 
            flex: 1; 
            min-width: 140px; 
            cursor: pointer;

        .btn-poster {

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

</head>

    <script>
// ==========================================================
// PART 1 OF 10: CORE FRAMEWORK ARCHITECTURE & DATABASES
// ==========================================================

// Global variable matrices bound locally to cross-module scope threads
let activePeak = null;
let lastUserLat = null;
let lastUserLng = null;
let db = null;
let radarSweepAngle = 0;
let nearestFiveCache = [];
let currentRawImageSrc = null;

// NEW: Throttle map to ensure audio bite doesn't trigger repeatedly in loop cycles
let playThrottleMap = new Set(); 

/**
 * NEW: Audio Notification Core Engine
 * Plays local Cantonese voice prompt cue.
 * Safe from background permission blocks on mobile Safari & iOS.
 */
function playCheckInAudioBite() {
    if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance("可以打卡啦");
        utterance.lang = "zh-HK"; // Force Cantonese localization accent output
        utterance.rate = 1.0;     // Normal human reading pacing velocity
        window.speechSynthesis.speak(utterance);
    }
}
        
/**
 * Initializes the client-side IndexedDB instance ("PeakStampDB")
 * Builds structural object store arrays for offline capability.
 */
function initDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open("PeakStampDB", 1);
        
        request.onupgradeneeded = function(e) {
            const database = e.target.result;
            if (!database.objectStoreNames.contains("stamps")) {
                database.createObjectStore("stamps", { keyPath: "id" });
            }
        };
        
        request.onsuccess = function(e) { 
            db = e.target.result; 
            resolve(); 
        };
        
        request.onerror = function() { 
            reject(); 
        };
    });
}
// ==========================================================
// PART 2 OF 10: DATABASE KEY-VALUE I/O TRANSACTION HANDLERS
// ==========================================================

/**
 * Retrieves a raw image stamp object entry from persistent storage.
 * @param {string} id - The specific alphanumeric identifier of the peak.
 */
function getRawRecordFromDB(id) {
    return new Promise((resolve) => {
        if (!db) return resolve(null);
        const transaction = db.transaction(["stamps"], "readonly");
        const store = transaction.objectStore("stamps");
        const request = store.get(id);
        request.onsuccess = function(e) { 
            resolve(e.target.result ? e.target.result : null); 
        };
        request.onerror = function() { 
            resolve(null); 
        };
    });
}

/**
 * Writes or updates a custom climbing record configuration block.
 */
function saveRecordToDB(id, dataUrl, rawImg, currentStyle) {
    return new Promise((resolve, reject) => {
        if (!db) return reject();
        const transaction = db.transaction(["stamps"], "readwrite");
        const store = transaction.objectStore("stamps");
        const request = store.put({ 
            id: id, 
            dataUrl: dataUrl, 
            rawImg: rawImg, 
            style: currentStyle, 
            timestamp: Date.now() 
        });
        request.onsuccess = function() { resolve(); };
        request.onerror = function(e) { reject(e); };
    });
}
// ==========================================================
// PART 3 OF 10: MASS DATA QUERY & GEOSPATIAL FILTER ENGINE
// ==========================================================

/**
 * Grabs all primary primary key IDs of currently unlocked mountain summits.
 */
function getAllUnlockedIds() {
    return new Promise((resolve) => {
        if (!db) return resolve([]);
        const transaction = db.transaction(["stamps"], "readonly");
        const store = transaction.objectStore("stamps");
        const request = store.getAllKeys();
        request.onsuccess = function(e) { resolve(e.target.result); };
        request.onerror = function() { resolve([]); };
    });
}

/**
 * Extracts the complete collection of raw photo stamp entities from storage.
 */
function getAllStampsData() {
    return new Promise((resolve) => {
        if (!db) return resolve([]);
        const transaction = db.transaction(["stamps"], "readonly");
        const store = transaction.objectStore("stamps");
        const request = store.getAll();
        request.onsuccess = function(e) { resolve(e.target.result); };
        request.onerror = function() { resolve([]); };
    });
}

/**
 * Programmatically appends altitude and geographical zone tags to peak matrices.
 */
function assignPeakFilters(peak) {
    if (peak.elev >= 700) peak.levelTag = "lvl5";
    else if (peak.elev >= 500) peak.levelTag = "lvl4";
    else if (peak.elev >= 300) peak.levelTag = "lvl3";
    else if (peak.elev >= 150) peak.levelTag = "lvl2";
    else peak.levelTag = "lvl1";
    
    const name = peak.name.toLowerCase();
    if (peak.lng < 114.05 && peak.lat < 22.34) {
        peak.regionTag = "lantau";
    } else if (peak.lng >= 114.23 && peak.lat <= 22.50) {
        peak.regionTag = "saikung";
    } else if (peak.lat < 22.29 && peak.lng >= 114.11 && peak.lng <= 114.26) {
        peak.regionTag = "hki-kln";
    } else if (name.includes("lion rock") || name.includes("kowloon peak") || name.includes("tate's") || name.includes("checkerboard") || name.includes("tung shan")) {
        peak.regionTag = "hki-kln";
    } else if (peak.lng < 114.15) {
        peak.regionTag = "nt-west";
    } else {
        peak.regionTag = "nt-east";
    }
}
// ==========================================================
// PART 4 OF 10: HIGH-PRECISION GEOSPATIAL MATH FORMULAS
// ==========================================================

/**
 * Calculates the absolute distance between two coordinates in meters.
 * Uses the Haversine formula to maintain strict alignment over curved grids.
 */
function calculateHaversineDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000; // Mean radius of the Earth in meters
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}

/**
 * Computes the forward compass bearing heading angle from point A to point B.
 * Returns a normalized value between 0° and 360° mapping clockwise from North.
 */
function calculateBearing(lat1, lng1, lat2, lng2) {
    const dLon = (lng2 - lng1) * Math.PI / 180;
    const lat1Rad = lat1 * Math.PI / 180;
    const lat2Rad = lat2 * Math.PI / 180;
    const y = Math.sin(dLon) * Math.cos(lat2Rad);
    const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - 
              Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
    const brng = Math.atan2(y, x) * 180 / Math.PI;
    return (brng + 360) % 360;
}
// ==========================================================
// PART 5 OF 10: MOUNTAIN GRID CARD RENDERING MATRIX
// ==========================================================

/**
 * Dynamically queries parameters and clears/re-renders the main card view.
 * Leverages DocumentFragments to safely minimize viewport layout thrashing.
 */
async function renderPeaksGrid() {
    const grid = document.getElementById("peaks-grid");
    if (!grid) return;
    
    const regionFilter = document.getElementById("filter-region").value;
    const levelFilter = document.getElementById("filter-level").value;
    const statusFilter = document.getElementById("filter-status").value;
    
    const targetPeaks = window.peaks || (typeof peaks !== "undefined" ? peaks : []);
    const unlockedIds = await getAllUnlockedIds();
    const totalUnlockedCount = unlockedIds.length;
    let renderedCount = 0;
    
    const fragment = document.createDocumentFragment();
    
    targetPeaks.forEach((peak, index) => {
        const isUnlocked = unlockedIds.includes(peak.id);
        const matchRegion = (regionFilter === "all" || peak.regionTag === regionFilter);
        const matchLevel = (levelFilter === "all" || peak.levelTag === levelFilter);
        const matchStatus = (statusFilter === "all" || 
            (statusFilter === "unlocked" && isUnlocked) || 
            (statusFilter === "locked" && !isUnlocked));
        
        if (matchRegion && matchLevel && matchStatus) {
            renderedCount++;
            const card = document.createElement("div");
            card.className = `card ${isUnlocked ? 'unlocked' : 'locked'}`;
            card.innerHTML = `
                <div class="badge-icon">⛰</div>
                <strong style="font-size: 13px; display: block; min-height: 36px;">#${index + 1} ${peak.name}</strong>
                <div style="font-size: 11px; color: #666; margin: 4px 0;">海拔高度: ${peak.elev} 米</div>
                ${isUnlocked ? 
                    `<button class="btn" style="background: #2E5A44; padding: 6px;" onclick="viewStamp('${peak.id}')">檢視印章</button>` : 
                    `<div style="font-size: 11px; color: #999; margin-top: 10px;">尚未攀登解鎖</div>`
                }
            `;
            fragment.appendChild(card);
        }
    });
    
    grid.textContent = "";
    grid.appendChild(fragment);
    
    document.getElementById("progress-text").innerText = `${totalUnlockedCount} / ${targetPeaks.length} 已解鎖`;
    document.getElementById("progress-fill").style.width = `${(totalUnlockedCount / (targetPeaks.length || 1)) * 100}%`;
    document.getElementById("grid-count-text").innerText = `當前篩選符合項目: ${renderedCount} 座山峰`;
}
// ==========================================================
// PART 6 OF 10: PROXIMITY VERIFIER & AUDIO UNLOCKER
// ==========================================================
let playThrottleMap = new Set(); // Prevents sound-bites looping constantly

function updateRadarList(userLat, userLng) {
    lastUserLat = userLat; lastUserLng = userLng;
    const targetPeaks = window.peaks || (typeof peaks !== "undefined" ? peaks : []);
    
    getAllUnlockedIds().then(unlockedIds => {
        const peaksWithDistance = targetPeaks.map(peak => {
            return { 
                ...peak, 
                distance: calculateHaversineDistance(userLat, userLng, peak.lat, peak.lng), 
                bearing: calculateBearing(userLat, userLng, peak.lat, peak.lng) 
            };
        });
        
        peaksWithDistance.sort((a, b) => a.distance - b.distance);
        nearestFiveCache = peaksWithDistance.slice(0, 5);
        
        const radarListDiv = document.getElementById("radar-list");
        if (!radarListDiv) return;
        
        const fragment = document.createDocumentFragment();
        
        nearestFiveCache.forEach(peak => {
            const item = document.createElement("div");
            item.className = "radar-item";
            const isUnlocked = unlockedIds.includes(peak.id);
            const kmDist = peak.distance >= 1000 ? `${(peak.distance / 1000).toFixed(2)} 公里` : `${Math.round(peak.distance)} 米`;
            
            let actionContent = `<span class="distance-tag">距離 ${kmDist}</span>`;
            
            if (peak.distance <= 40 && !isUnlocked) {
                // Play notification alert precisely once per peak area arrival entry
                if (!playThrottleMap.has(peak.id)) {
                    playCheckInAudioBite();
                    playThrottleMap.add(peak.id);
                }
                actionContent = `<button class="btn-stamp-now" style="background:#E67E22;" onclick="collectIllustratedStamp('${peak.id}')">🌟 可以打卡啦！點擊收集</button>`;
            } else if (isUnlocked) {
                actionContent = `<span class="distance-tag" style="background: #2E5A44">✓ 已打卡</span>`;
            }
            
            item.innerHTML = `<div><strong>${peak.name}</strong><br><span style="font-size: 11px; color: #777;">標高: ${peak.elev} 米</span></div><div>${actionContent}</div>`;
            fragment.appendChild(item);
        });
        radarListDiv.textContent = "";
        radarListDiv.appendChild(fragment);
    });
}

}

/**
 * Triggers consecutive canvas drawing ticks using standard display refresh synchronization.
 * Renders spatial proximity grids and maps targets based on historical GPS markers.
 */
function drawRadarGrid() {
    const canvas = document.getElementById("radar-canvas");
    if (!canvas) return;
    
    const context = canvas.getContext("2d");
    const cx = canvas.width / 2; 
    const cy = canvas.height / 2; 
    const maxRadius = cx - 10;
    
    context.clearRect(0, 0, canvas.width, canvas.height);
    context.strokeStyle = "rgba(46, 90, 68, 0.4)"; 
    context.lineWidth = 1;
    
    // Draw concentric radar metric range cross-rings
    for (let r = maxRadius / 3; r <= maxRadius; r += maxRadius / 3) {
        context.beginPath(); 
        context.arc(cx, cy, r, 0, 2 * Math.PI); 
        context.stroke();
    }
    
    // Draw crosshair axes lines mapping horizontal and vertical points
    context.beginPath(); context.moveTo(cx, 10); context.lineTo(cx, canvas.height - 10); context.stroke();
    context.beginPath(); context.moveTo(10, cy); context.lineTo(canvas.width - 10, cy); context.stroke();
    
    // Render compass directions label anchors
    context.fillStyle = "#2e5a44"; context.font = "10px sans-serif"; context.textAlign = "center";
    context.fillText("N", cx, 22);
    
    // Map proximity locations over coordinate spaces
    if (nearestFiveCache.length > 0) {
        const boundaryDist = Math.max(...nearestFiveCache.map(p => p.distance), 100);
        nearestFiveCache.forEach(peak => {
            const angleRad = (peak.bearing - 90) * Math.PI / 180;
            const rDist = (peak.distance / boundaryDist) * maxRadius;
            const px = cx + rDist * Math.cos(angleRad); 
            const py = cy + rDist * Math.sin(angleRad);
            
            // Outer proximity halo bloom layer
            context.beginPath(); 
            context.arc(px, py, 6, 0, 2 * Math.PI); 
            context.fillStyle = peak.distance <= 40 ? "rgba(230, 126, 34, 0.4)" : "rgba(139, 90, 43, 0.3)"; 
            context.fill();
            
            // Inner core target coordinate pixel point
            context.beginPath(); 
            context.arc(px, py, 3, 0, 2 * Math.PI); 
            context.fillStyle = peak.distance <= 40 ? "#E67E22" : "#8B5A2B"; 
            context.fill();
        });
    }
    
    // Advance tracking sweep angles and paint trailing glow gradients
    radarSweepAngle = (radarSweepAngle + 1.5) % 360;
    const sweepRad = (radarSweepAngle - 90) * Math.PI / 180;
    
    context.beginPath(); 
    context.moveTo(cx, cy); 
    context.arc(cx, cy, maxRadius, sweepRad - 0.2, sweepRad, false); 
    context.lineTo(cx, cy); 
    context.fillStyle = "rgba(46, 90, 68, 0.15)"; 
    context.fill();
    
    // Draw leading neon telemetry edge swipe rule line
    context.beginPath(); 
    context.moveTo(cx, cy); 
    context.lineTo(cx + maxRadius * Math.cos(sweepRad), cy + maxRadius * Math.sin(sweepRad)); 
    context.strokeStyle = "rgba(46, 90, 68, 0.6)"; 
    context.lineWidth = 1.5; 
    context.stroke();
    
    requestAnimationFrame(drawRadarGrid);
}

/**
 * Extracts the single target file from photo streams and passes it to the canvas.
 */
function handlePhotoUpload(event) {
    const files = event.target.files; 
    if (!files || files.length === 0) return;
    
    document.getElementById("loading").style.display = "flex";
    const reader = new FileReader();
    reader.onload = function(e) { 
        currentRawImageSrc = e.target.result; 
        processImageAndStamp(currentRawImageSrc, "classic"); 
    };
    reader.readAsDataURL(files[0]); 
    event.target.value = "";
}

/**
 * Safely extracts the image payload when replacing pictures on an existing stamp.
 */

    const files = event.target.files; 
    if (!files || files.length === 0) return;
    
    document.getElementById("loading").style.display = "flex";

// ==========================================================
// PART 9 OF 10: GOWILD WATERMARK OVERLAY ENGINE
// ==========================================================
function processImageAndStamp(imageSrc, styleName) {
    const img = new Image();
    img.onload = async function() {
        const canvas = document.getElementById("filter-canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 800; canvas.height = 800;
        
        const minDim = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - minDim) / 2, (img.height - minDim) / 2, minDim, minDim, 0, 0, 800, 800);
        
        ctx.textAlign = "left";
        
        // Render the custom GOWILD-inspired tracking watermark overlay card banner
        if (styleName === "gowild_photo" || styleName === "classic") {
            const boxWidth = 340; const boxHeight = 85;
            const x = 30; const y = 800 - boxHeight - 30; 
            
            ctx.fillStyle = "rgba(16, 42, 29, 0.75)"; // GoWild jungle-green base
            ctx.beginPath();
            ctx.roundRect(x, y, boxWidth, boxHeight, 8);
            ctx.fill();
            
            ctx.fillStyle = "#FFFFFF"; ctx.font = "bold 24px sans-serif";
            ctx.fillText("⛰ GOWILD OUTDOOR", x + 20, y + 38);
            
            ctx.fillStyle = "#A3CB38"; ctx.font = "bold 14px monospace";
            ctx.fillText(`ALT: ${activePeak.elev}m | GPS: ${activePeak.lat.toFixed(4)}°, ${activePeak.lng.toFixed(4)}°`, x + 20, y + 66);
        }
        
        try {
            const finalDataUrl = canvas.toDataURL("image/jpeg", 0.85);
            if (db) {
                const transaction = db.transaction(["stamps"], "readwrite");
                const store = transaction.objectStore("stamps");
                const existingRecord = await getRawRecordFromDB(activePeak.id) || {};
                
                store.put({
                    id: activePeak.id,
                    dataUrl: finalDataUrl,
                    rawImg: imageSrc,
                    // Keep user photo base64 cached behind illustration artwork views
                    userPhotoBase64: styleName === "gowild_photo" ? imageSrc : (existingRecord.userPhotoBase64 || null),
                    style: styleName, 
                    timestamp: Date.now()
                });
            }
            document.getElementById("loading").style.display = "none";
            document.getElementById("modal-img").src = finalDataUrl;
            await viewStamp(activePeak.id);
            await renderPeaksGrid();
        } catch(e) {
            document.getElementById("loading").style.display = "none";
        }
    };
    img.src = imageSrc;
}

async function viewStamp(id) {
    const targetPeaks = window.peaks || (typeof peaks !== "undefined" ? peaks : []);
    activePeak = targetPeaks.find(p => p.id === id);
    const record = await getRawRecordFromDB(id);
    if (!record) return;

    document.getElementById("modal-title").innerText = `${activePeak.name}`;
    document.getElementById("modal-img").src = record.dataUrl;
    currentRawImageSrc = record.rawImg;

    document.getElementById("modal-action-bar").innerHTML = `
        <div style="display:flex; gap:10px; margin-bottom:12px;">
            <button class="btn" style="flex:1; background:${record.style === 'illustration_view' ? '#2E5A44' : '#777'};" onclick="switchToViewMode('illustration_view')">🖼 官方手繪原圖</button>
            <button class="btn" style="flex:1; background:${record.style === 'gowild_photo' ? '#2E5A44' : '#777'};" onclick="switchToViewMode('gowild_photo')">📸 我的戶外相片</button>
        </div>
        <button class="btn" style="background: #34495e; width:100%;" onclick="triggerReplaceStamp('${activePeak.id}')">拍攝或上傳相片 (套用 GOWILD 水印)</button>
    `;
    document.getElementById("result-modal").style.display = "flex";
}

async function switchToViewMode(targetMode) {
    if (!activePeak) return;
    const record = await getRawRecordFromDB(activePeak.id);
    if (!record) return;

    if (targetMode === "illustration_view") {
        const dynamicIllustrationPath = `assets/illustrations/${activePeak.id}.jpg`;
        processImageAndStamp(dynamicIllustrationPath, "illustration_view");
        return;
    } else if (targetMode === "gowild_photo") {
        if (!record.userPhotoBase64) {
            alert("您尚未上傳該山峰的個人相片，請點擊下方按鈕上傳！");
            return;
        }
        processImageAndStamp(record.userPhotoBase64, "gowild_photo");
        return;
    }
    await viewStamp(activePeak.id);
}

async function collectIllustratedStamp(id) {
    const targetPeaks = window.peaks || (typeof peaks !== "undefined" ? peaks : []);
    activePeak = targetPeaks.find(p => p.id === id);
    const dynamicIllustrationPath = `assets/illustrations/${activePeak.id}.jpg`;
    
    processImageAndStamp(dynamicIllustrationPath, "illustration_view");
    alert(`成功收集 #${activePeak.name} 紀念插畫！可進入集章冊中查看並上傳個人相片。`);
    await renderPeaksGrid();
}

async function exportBackupJSON() {
    const allData = await getAllStampsData();
    if (allData.length === 0) return alert("未找到可備份進度！");
    const blob = new Blob([JSON.stringify({ appId: "PeakStamp-HK160", stampsData: allData })], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = `PeakStamp_Backup.json`; a.click();
}

function importBackupJSON(event) {
    const files = event.target.files;
    if (!files || files.length === 0) return;
    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            const parsed = JSON.parse(e.target.result);
            if (parsed.appId !== "PeakStamp-HK160") throw new Error();
            for (const item of parsed.stampsData) {
                await saveRecordToDB(item.id, item.dataUrl, item.rawImg, item.style);
            }
            alert("回復成功！"); await renderPeaksGrid();
        } catch (err) { alert("備份檔損壞或無效"); }
    };
    reader.readAsText(files[0]);
}

async function generateAchievementPoster() {
    const canvas = document.getElementById("poster-canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = 800; canvas.height = 1250;
    ctx.fillStyle = "#F4F4F0"; ctx.fillRect(0, 0, 800, 1250);
    ctx.fillStyle = "#2E5A44"; ctx.fillRect(20, 20, 760, 150);
    const targetPeaks = window.peaks || (typeof peaks !== "undefined" ? peaks : []);
    const unlockedIds = await getAllUnlockedIds();
    const rate = ((unlockedIds.length / (targetPeaks.length || 1)) * 100).toFixed(1);
    
    ctx.fillStyle = "#FFFFFF"; ctx.textAlign = "center"; ctx.font = "bold 32px sans-serif";
    ctx.fillText("香港 160 考山成就集章榜", 400, 85);
    ctx.font = "600 20px monospace"; ctx.fillStyle = "#E67E22";
    ctx.fillText(`已解鎖: ${unlockedIds.length} / 160 | 制霸率: ${rate}%`, 400, 130);
    
    const cols = 16; const startX = 42; const startY = 210; const boxW = 40; const boxH = 48; const gapX = 5; const gapY = 12;
    for (let i = 0; i < targetPeaks.length; i++) {
        const isUnlocked = unlockedIds.includes(targetPeaks[i].id);
        const col = i % cols; const row = Math.floor(i / cols);
        const x = startX + col * (boxW + gapX); const y = startY + row * (boxH + gapY);
        ctx.fillStyle = isUnlocked ? "#E3ECE4" : "#EAEAEA"; ctx.fillRect(x, y, boxW, boxH);
        ctx.strokeStyle = isUnlocked ? "#2E5A44" : "#CCCCCC"; ctx.strokeRect(x, y, boxW, boxH);
        ctx.fillStyle = isUnlocked ? "#2E5A44" : "#999999"; ctx.font = "14px sans-serif";
        ctx.fillText(isUnlocked ? "⛰" : "🔒", x + boxW / 2, y + 24);
        ctx.font = "bold 9px monospace"; ctx.fillText(`${i + 1}`, x + boxW / 2, y + 42);
    }
    const posterDataUrl = canvas.toDataURL("image/png");
    document.getElementById("modal-title").innerText = "登頂海報生成成功";
    document.getElementById("modal-img").src = posterDataUrl;
    document.getElementById("modal-action-bar").innerHTML = `<p style="font-size:12px;color:#e67e22;">提示：長按上方圖片即可儲存到相簿！</p>`;
    document.getElementById("result-modal").style.display = "flex";
}
