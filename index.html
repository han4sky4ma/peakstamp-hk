 <!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2E5A44">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <title>PeakStamp HK</title>
</head>
<body>
    <div class="header">
        <h2>PeakStamp HK</h2>
        <p>全港深山 GPS 離線集章冊</p>
    </div>

    <!-- Part 2: Radar Section Embedded Template -->
    <div id="radar-component"></div>

    <!-- Part 3: Progress & Simulator Embedded Template -->
    <div id="progress-component"></div>

    <!-- Part 4: Data Sync & Backup Actions Template -->
    <div id="backup-component"></div>

    <!-- Part 5: Layout Filtration Controls Template -->
    <div id="filter-component"></div>

    <div class="grid-count-tag" id="grid-count-text">當前篩選符合項目: 0 座山峰</div>
    <div class="grid" id="peaks-grid"></div>

    <!-- Hidden native hardware API interfaces -->
    <input type="file" id="camera-input" accept="image/*" capture="camera" style="display: none;">
    <input type="file" id="replace-input" accept="image/*" style="display: none;">
    <input type="file" id="import-file-input" accept=".json" style="display: none;">
    
    <!-- Render Layers Layout Canvases -->
    <canvas id="filter-canvas" style="display: none;"></canvas>
    <canvas id="poster-canvas" style="display: none;"></canvas>

    <!-- Part 6: Modals Overlay Infrastructure Template -->
    <div id="modal-component"></div>

    <!-- Application Execution Pipeline Script Hooks -->
    <script src="peaks.js"></script>
    <script src="db.js"></script>
    <script src="geo.js"></script>
    <script src="ui.js"></script>
    <script src="stamps.js"></script>
    <script src="app.js"></script>
</body>
</html>
